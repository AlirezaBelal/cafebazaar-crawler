<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">A local collection blueprint</title><desc id="desc">Illustration of Python HTTP requests, permitted responses, parsing and validation, and SQLite persistence. No live activity is shown.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#d1dfd2" stroke-width=".6"/></pattern></defs><rect width="960" height="400" rx="12" fill="#e7f2e8"/><rect width="960" height="400" rx="12" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="42" fill="#315840" font-size="13" letter-spacing="1">COLLECTION BLUEPRINT</text><text x="920" y="42" text-anchor="end" fill="#315840" font-size="12">ILLUSTRATION / LOCAL EXECUTION</text><path d="M221 203H290m170 0h80m170 0h62" fill="none" stroke="#52815f" stroke-width="3" stroke-dasharray="5 6"/><g transform="translate(40 101)"><rect width="180" height="200" rx="10" fill="#123d32"/><rect x="16" y="17" width="30" height="6" rx="3" fill="#c8e3c9"/><text x="20" y="66" font-size="13" fill="#d0f0d6">01 / LOCAL CLI</text><text x="20" y="97" font-size="21" fill="white">Python</text><text x="20" y="126" font-size="13" fill="#c8ddd0">Scope and page limits</text><text x="20" y="151" font-size="13" fill="#c8ddd0">HTTP request adapter</text><text x="20" y="176" font-size="13" fill="#c8ddd0">User-started execution</text></g><g transform="translate(285 106)"><rect x="10" y="-10" width="170" height="190" rx="8" fill="#c5dac7"/><rect width="170" height="190" rx="8" fill="#fff" stroke="#9ebca5"/><text x="18" y="40" font-size="13" fill="#315840">02 / RESPONSES</text><text x="18" y="74" font-size="20" fill="#153c2c">Permitted data</text><path d="M18 98h130m-130 17h110m-110 17h130m-130 17h85" stroke="#9ab4a0" stroke-width="5"/><text x="18" y="176" font-size="12" fill="#52665d">Unofficial upstream API</text></g><g transform="translate(540 106)"><rect width="170" height="190" rx="8" fill="#fff" stroke="#9ebca5"/><text x="18" y="40" font-size="13" fill="#315840">03 / PARSING</text><text x="18" y="74" font-size="20" fill="#153c2c">Supported fields</text><g fill="#315840" font-size="13"><text x="18" y="112">Package identity</text><text x="18" y="137">Metadata validation</text><text x="18" y="162">Duplicate handling</text></g></g><g transform="translate(774 121)"><path d="M0 23v115c0 31 145 31 145 0V23" fill="#d0e8c0" stroke="#648266" stroke-width="2"/><ellipse cx="72.5" cy="23" rx="72.5" ry="23" fill="#c4ddb2" stroke="#648266" stroke-width="2"/><text x="72.5" y="90" text-anchor="middle" font-size="22" fill="#153c2c">SQLite</text><text x="72.5" y="114" text-anchor="middle" font-size="13" fill="#315840">On your computer</text></g><text x="40" y="358" font-size="13" fill="#315840">Local outputs: SQLite database · Persian HTML report · CSV export</text><text x="920" y="358" text-anchor="end" font-size="12" fill="#52665d">NO HOSTED COLLECTOR</text></g></svg>
