name: GitHub Pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  pull_request:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_product_site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy product website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published product and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          test "$SITE_URL" = 'https://alirezabelal.github.io/cafebazaar-crawler/'
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$SITE_URL" --output "$response_file"
          grep -Fq '<title>CafeBazaar Crawler — Local Python metadata collection</title>' "$response_file"
          grep -Fq 'static product guide' "$response_file"
          grep -Fq 'https://github.com/AlirezaBelal/cafebazaar-crawler' "$response_file"
          grep -Fq 'href="#installation"' "$response_file"
          for asset in styles.css assets/mark.svg assets/collection-flow.svg; do
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "${SITE_URL}${asset}" --output /dev/null
          done
