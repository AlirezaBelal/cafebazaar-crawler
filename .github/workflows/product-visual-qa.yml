name: Product visual QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Serve new standalone product site
        run: python3 -m http.server 8765 --directory site > /tmp/cafebazaar-site.log 2>&1 &
      - name: Check product and portfolio at seven widths
        run: node tests/product-visual-qa.mjs
      - name: Check production pages after release
        if: github.event_name != 'pull_request'
        env:
          PRODUCT_URL: https://alirezabelal.github.io/cafebazaar-crawler/
          QA_OUTPUT: qa-evidence/production
        run: node tests/product-visual-qa.mjs
      - name: Preserve visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafebazaar-product-qa-${{ github.run_attempt }}
          path: qa-evidence/
          retention-days: 14
