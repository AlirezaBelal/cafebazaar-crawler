name: Product visual QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Serve new standalone product site
        run: python3 -m http.server 8765 --directory site > /tmp/cafebazaar-site.log 2>&1 &
      - name: Check product and portfolio at seven widths
        run: node tests/product-visual-qa.mjs
      - name: Check production pages after release
        if: github.event_name != 'pull_request'
        env:
          PRODUCT_URL: https://alirezabelal.github.io/cafebazaar-crawler/
          QA_OUTPUT: qa-evidence/production
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const base = process.env.PRODUCT_URL;
          const expected = await Promise.all(['index.html', 'styles.css'].map(p => readFile('site/' + p, 'utf8')));
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const actual = await Promise.all(['', 'styles.css'].map(async p => {
                const response = await fetch(base + p + '?release-qa=' + process.env.GITHUB_RUN_ID + '-' + attempt, {signal: AbortSignal.timeout(10000), headers: {'cache-control': 'no-cache'}});
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
              }));
              if (actual.every((body, i) => body === expected[i])) { ready = true; break; }
            } catch (error) { console.log('Waiting for release publication: ' + error.message); }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!ready) throw new Error('Published HTML/CSS did not match the release before timeout');
          console.log('Published HTML and CSS match the checked-out release.');
          JS
          node tests/product-visual-qa.mjs
      - name: Preserve visual and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cafebazaar-product-qa-${{ github.run_attempt }}
          path: qa-evidence/
          retention-days: 14
