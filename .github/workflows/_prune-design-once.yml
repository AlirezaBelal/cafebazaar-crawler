name: One-time verified design branch cleanup

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/_prune-design-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  remove-merged-design-branch:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: prune verified design branch') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely delete only unchanged PR #4 head branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/4" --jq '.merged')" = true
          branch="design/premium-offline-dashboard-20261101"
          expected="cf1491c4f929443c8acd6df3796cc466a02ff8a0"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch changed; preserving it"
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          echo "Deleted merged, SHA-verified design branch"
