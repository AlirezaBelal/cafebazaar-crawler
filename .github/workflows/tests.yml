name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.check_os || matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
            check_os: ubuntu-latest
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Test browser-local import parser
        run: node --test tests/test_report_import.cjs


      - name: Product-site checks
        run: node --test tests/test_product_site.mjs
      - name: Offline CLI smoke
        run: |
          python src/main.py --demo --db artifacts/ci-demo.db
          python src/main.py --db artifacts/ci-demo.db --report artifacts/ci-report.html
          python src/main.py --db artifacts/ci-demo.db --export-csv artifacts/ci-apps.csv

