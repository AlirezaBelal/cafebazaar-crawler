name: One-time authorized CafeBazaar live smoke

on:
  push:
    branches: [feat/local-report-product-20261101]
    paths:
      - .github/workflows/_temporary-live-smoke.yml

permissions:
  contents: read

jobs:
  limited-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Probe one public app only using disposable SQLite
        run: python tests/live_smoke.py --yes-live
